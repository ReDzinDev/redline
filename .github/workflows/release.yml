name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify version metadata
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $pkgVersion = (Get-Content -Raw "package.json" | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $cargoToml = Get-Content -Raw "src-tauri/Cargo.toml"
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not parse version from src-tauri/Cargo.toml"
          }
          $cargoVersion = $Matches[1]

          Write-Host "package.json: $pkgVersion | tauri.conf.json: $tauriVersion | Cargo.toml: $cargoVersion"
          if ($pkgVersion -ne $tauriVersion -or $pkgVersion -ne $cargoVersion) {
            throw "Version mismatch across package.json ($pkgVersion), tauri.conf.json ($tauriVersion), and Cargo.toml ($cargoVersion)"
          }

          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$') {
              throw "Tag '$($env:REF_NAME)' does not match vMAJOR.MINOR.PATCH"
            }
            $tagVersion = $Matches[1]
            if ($tagVersion -ne $pkgVersion) {
              throw "Tag version '$tagVersion' does not match app version '$pkgVersion'"
            }
          }

          "APP_VERSION=$pkgVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Typecheck frontend
        run: pnpm run typecheck

      - name: Frontend unit tests
        run: pnpm test

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Build Windows NSIS installer
        run: pnpm exec tauri build --ci --bundles nsis -- --locked

      - name: Stage installer and generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $nsisDir -Filter "*_x64-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly 1 NSIS installer in $nsisDir, found $($installers.Count)"
          }

          $installer = $installers[0]
          $outDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $dest = Join-Path $outDir $installer.Name
          Copy-Item -Path $installer.FullName -Destination $dest -Force

          $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $($installer.Name)`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText((Join-Path $outDir "SHA256SUMS.txt"), $line, $utf8NoBom)

          Get-ChildItem -Path $outDir | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "SHA256SUMS.txt: $line"

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redline-windows-nsis
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redline-windows-nsis
          path: release-assets

      - name: Verify SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
          else
            extra_flags=()
            if [[ "$TAG" == *-* ]]; then
              extra_flags+=(--prerelease)
            fi
            gh release create "$TAG" release-assets/* \
              --repo "$REPO" \
              --title "Redline $TAG" \
              --generate-notes \
              "${extra_flags[@]}"
          fi
